name: Portable release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-package:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Require release tag to match application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/DesktopGuard.App/DesktopGuard.App.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if (-not $version -or $env:RELEASE_TAG -ne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' must match the application version 'v$version'."
          }

      - name: Restore locked dependencies and require a complete clean vulnerability audit
        shell: pwsh
        run: dotnet restore DesktopGuard.sln --locked-mode -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905

      - name: Run solution tests
        shell: pwsh
        run: dotnet test DesktopGuard.sln --no-restore

      - name: Verify formatting
        shell: pwsh
        run: dotnet format DesktopGuard.sln --verify-no-changes --no-restore

      - name: Report vulnerable direct and transitive packages
        shell: pwsh
        run: dotnet package list --project DesktopGuard.sln --vulnerable --include-transitive

      - name: Require the file symlink security regression to run
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'desktop-guard-symlink-test'
          dotnet test tests/DesktopGuard.App.Tests/DesktopGuard.App.Tests.csproj `
            --no-restore `
            --filter 'FullyQualifiedName~RetryMove_ReparseDestinationNeverRemovesTheSource' `
            --logger 'trx;LogFileName=symlink-regression.trx' `
            --results-directory $resultsDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "The file symlink regression failed with exit code $LASTEXITCODE."
          }

          $resultPath = Join-Path $resultsDirectory 'symlink-regression.trx'
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw 'The file symlink regression did not produce a test result.'
          }

          [xml]$testRun = Get-Content -LiteralPath $resultPath -Raw
          $testResults = @($testRun.TestRun.Results.UnitTestResult)
          if ($testResults.Count -ne 1 -or $testResults[0].outcome -ne 'Passed') {
            throw 'The file symlink security regression must pass; skipped or inconclusive execution blocks release.'
          }

      - name: Build portable package
        shell: pwsh
        run: .\scripts\package-portable.ps1

      - name: Pass package to release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-package
          path: artifacts/portable/DesktopGuard-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  create-draft-release:
    needs: build-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download portable package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable-package
          path: ${{ runner.temp }}/portable-release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix." >&2
            exit 1
          fi

          package_path="$RUNNER_TEMP/portable-release/DesktopGuard-win-x64.zip"
          if [[ ! -f "$package_path" || -L "$package_path" ]]; then
            echo "Portable package is missing or is not a regular file." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "$package_path" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes --draft --verify-tag
